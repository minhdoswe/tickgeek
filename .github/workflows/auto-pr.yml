name: Auto PR

on:
  push:
    branches-ignore: [main, production]

permissions:
  contents: read # the PR is opened with AUTO_PR_TOKEN, not GITHUB_TOKEN

concurrency:
  group: auto-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # --fill reads the commits between main and this branch

      # Open a PR for this branch if none is open, then set auto-merge on every push:
      #   Claude's work (branch claude/…, or any commit since main with a "Co-Authored-By: Claude"
      #   trailer): auto-merge off, so the PR waits for you to read claude-review and merge by hand.
      #   Anything else: auto-merge on; GitHub merges (merge commit) once main's required checks pass.
      - name: Open PR and set auto-merge
        env:
          GH_TOKEN: ${{ secrets.AUTO_PR_TOKEN }} # fine-grained PAT, so the PR is opened as you
        run: |
          set -euo pipefail
          open=$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number --jq length)
          if [ "$open" = 0 ]; then
            gh pr create --base main --head "$GITHUB_REF_NAME" --fill
          else
            echo "A PR for $GITHUB_REF_NAME is already open"
          fi

          # Read the log into a variable first: piping git log into grep -q under pipefail can fail
          # on SIGPIPE when grep stops early, which would hide a match.
          messages=$(git log --format=%B origin/main..HEAD)
          if [[ "$GITHUB_REF_NAME" == claude/* ]] || grep -qi '^co-authored-by: claude' <<<"$messages"; then
            # Read the state in its own assignment, so a failed gh call stops the step (set -e)
            # instead of reading as "off". A red step is visible, but it does not block a merge.
            auto=$(gh pr view "$GITHUB_REF_NAME" --json autoMergeRequest --jq '.autoMergeRequest != null')
            if [ "$auto" = true ]; then
              gh pr merge "$GITHUB_REF_NAME" --disable-auto
              still=$(gh pr view "$GITHUB_REF_NAME" --json autoMergeRequest --jq '.autoMergeRequest != null')
              if [ "$still" != false ]; then
                echo "::error::Auto-merge is still on for Claude's PR. Turn it off by hand."; exit 1
              fi
            fi
            echo "Claude's work: auto-merge off. Merge this PR by hand after reading claude-review."
          else
            gh pr merge "$GITHUB_REF_NAME" --auto --merge
          fi
