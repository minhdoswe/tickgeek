name: CI

on:
  pull_request:
  push:
    branches: [production]
  workflow_call:                           # lets deploy.yml run CI as a job before deploying

permissions:
  contents: read
  pull-requests: write

# PRs: one group per PR, so a new commit cancels the older run.
# Pushes: one group per commit, so every commit on main/production gets its own result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Pull requests run only the jobs whose folder changed.
# Pushes to main/production (merges) always run every job.
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            backend:
              - 'tickgeek_backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'tickgeek_frontend/**'
              - '.github/workflows/ci.yml'

  backend:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tickgeek_backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: ./mvnw -B verify
      - name: Build coverage table
        if: hashFiles('tickgeek_backend/target/site/jacoco/jacoco.xml') != ''
        run: |
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          root = ET.parse("target/site/jacoco/jacoco.xml").getroot()
          labels = {"INSTRUCTION": "Instructions", "BRANCH": "Branches", "LINE": "Lines",
                    "COMPLEXITY": "Complexity", "METHOD": "Methods", "CLASS": "Classes"}
          counters = {c.get("type"): c for c in root.findall("counter")}
          rows = ["<!-- backend-coverage -->", "### Backend coverage", "",
                  "| Metric | Covered | Missed | Coverage |", "|---|---:|---:|---:|"]
          for key, label in labels.items():
              c = counters.get(key)
              if c is None:
                  continue
              cov, mis = int(c.get("covered")), int(c.get("missed"))
              total = cov + mis
              pct = f"{cov / total * 100:.1f}%" if total else "n/a"
              rows.append(f"| {label} | {cov} | {mis} | {pct} |")
          md = "\n".join(rows) + "\n"
          open("coverage.md", "w").write(md)
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(md)
          PY

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request' && hashFiles('tickgeek_backend/target/site/jacoco/jacoco.xml') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          ID=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                 --jq '.[] | select(.body | startswith("<!-- backend-coverage -->")) | .id' | head -n1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$ID" -F body=@coverage.md
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@coverage.md
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: tickgeek_backend/target/site/jacoco/

  frontend:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tickgeek_frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: tickgeek_frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
