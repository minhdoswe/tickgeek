name: CI

on:
  pull_request:
  push:
    branches: [main, production]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tickgeek_backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: ./mvnw -B verify
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: tickgeek_backend/target/site/jacoco/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tickgeek_frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: tickgeek_frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
