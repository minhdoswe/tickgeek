name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_to:
        description: Commit SHA of an earlier successful production release to deploy again
        required: true
        type: string

permissions:
  contents: read

env:
  VERCEL_CLI: vercel@65.11.0

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tickgeek-backend" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: tickgeek_backend
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: tickgeek_frontend/package-lock.json

      - run: npm ci
        working-directory: tickgeek_frontend

      - name: Build frontend
        run: |
          mkdir -p .vercel
          echo '{"projectId":"unlinked","orgId":"unlinked","settings":{"framework":"nextjs","rootDirectory":"tickgeek_frontend"}}' > .vercel/project.json
          npx --yes "$VERCEL_CLI" build --prod --yes --standalone

      - name: Collect release
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}
        run: |
          mkdir release
          mv .vercel/output release/frontend
          echo "$IMAGE" > release/backend-image

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: release
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  staging:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.FRONTEND_URL }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: release

      - name: Deploy backend
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          api="https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys"
          auth="Authorization: Bearer $RENDER_API_KEY"
          body=$(jq -n --arg image "$(cat release/backend-image)" '{imageUrl: $image}')
          deploy_id=$(curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' -d "$body" "$api" | jq -r .id)
          echo "Render deploy $deploy_id"
          for _ in $(seq 1 90); do
            status=$(curl -fsS -H "$auth" "$api/$deploy_id" | jq -r .status)
            case "$status" in
              live) exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Render deploy $deploy_id ended as $status"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Render deploy $deploy_id not live after 15 minutes"; exit 1

      - name: Check backend health
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          for _ in $(seq 1 18); do
            if curl -fsS --max-time 20 "$BACKEND_URL/api/health" | jq -e '.status == "UP"'; then exit 0; fi
            sleep 10
          done
          echo "::error::$BACKEND_URL/api/health is not UP"; exit 1

      - name: Deploy frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          mkdir -p .vercel tickgeek_frontend
          mv release/frontend .vercel/output
          npx --yes "$VERCEL_CLI" deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"

      - name: Check frontend
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          for _ in $(seq 1 12); do
            if curl -fsS --max-time 20 -o /dev/null "$FRONTEND_URL/sign-in"; then exit 0; fi
            sleep 10
          done
          echo "::error::$FRONTEND_URL/sign-in does not answer"; exit 1

  production:
    needs: [build, staging]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      (needs.staging.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      deployments: read
    environment:
      name: production
      url: ${{ vars.FRONTEND_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - id: release
        name: Choose release
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLBACK_TO: ${{ inputs.rollback_to }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
            if [ "$head" != "$GITHUB_SHA" ]; then
              echo "::error::Superseded: main is now at $head. Approve the newest Deploy run instead."; exit 1
            fi
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$ROLLBACK_TO" --jq .sha)
          ok=""
          for id in $(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=production&sha=$sha" --jq '.[] | select(.creator.login == "github-actions[bot]") | .id'); do
            if [ "$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" --jq 'any(.[]; .state == "success")')" = true ]; then ok=1; break; fi
          done
          if [ -z "$ok" ]; then
            echo "::error::$sha was never deployed to production successfully"; exit 1
          fi
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=release-$sha" \
            --jq '[.artifacts[] | select(.expired | not)][0].workflow_run.id // empty')
          if [ -z "$run_id" ]; then
            echo "::error::No unexpired release-$sha artifact (kept 90 days)"; exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: release-${{ steps.release.outputs.sha }}
          path: release
          run-id: ${{ steps.release.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Deploy backend
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          api="https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys"
          auth="Authorization: Bearer $RENDER_API_KEY"
          body=$(jq -n --arg image "$(cat release/backend-image)" '{imageUrl: $image}')
          deploy_id=$(curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' -d "$body" "$api" | jq -r .id)
          echo "Render deploy $deploy_id"
          for _ in $(seq 1 90); do
            status=$(curl -fsS -H "$auth" "$api/$deploy_id" | jq -r .status)
            case "$status" in
              live) exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Render deploy $deploy_id ended as $status"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Render deploy $deploy_id not live after 15 minutes"; exit 1

      - name: Check backend health
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          for _ in $(seq 1 18); do
            if curl -fsS --max-time 20 "$BACKEND_URL/api/health" | jq -e '.status == "UP"'; then exit 0; fi
            sleep 10
          done
          echo "::error::$BACKEND_URL/api/health is not UP"; exit 1

      - name: Deploy frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          mkdir -p .vercel tickgeek_frontend
          mv release/frontend .vercel/output
          npx --yes "$VERCEL_CLI" deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"

      - name: Check frontend
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          for _ in $(seq 1 12); do
            if curl -fsS --max-time 20 -o /dev/null "$FRONTEND_URL/sign-in"; then exit 0; fi
            sleep 10
          done
          echo "::error::$FRONTEND_URL/sign-in does not answer"; exit 1
