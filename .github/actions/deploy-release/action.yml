name: Deploy release
description: >-
  Deploys a downloaded release (release/backend-image and release/frontend) to Render and
  Vercel, checking each side answers. Used by the staging and production jobs in deploy.yml.

inputs:
  render-api-key:
    description: Render API key
    required: true
  render-service-id:
    description: Render service ID of the backend
    required: true
  backend-url:
    description: Backend base URL, checked at /api/health
    required: true
  vercel-token:
    description: Vercel token
    required: true
  vercel-org-id:
    description: Vercel org ID
    required: true
  vercel-project-id:
    description: Vercel project ID
    required: true
  frontend-url:
    description: Frontend base URL, checked at /sign-in
    required: true
  vercel-cli:
    description: Vercel CLI package with exact version, e.g. vercel@65.11.0
    required: true

runs:
  using: composite
  steps:
    - name: Deploy backend
      shell: bash
      env:
        RENDER_API_KEY: ${{ inputs.render-api-key }}
        RENDER_SERVICE_ID: ${{ inputs.render-service-id }}
      run: |
        set -euo pipefail
        api="https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys"
        auth="Authorization: Bearer $RENDER_API_KEY"
        body=$(jq -n --arg image "$(cat release/backend-image)" '{imageUrl: $image}')
        # --fail-with-body still fails on an HTTP error but keeps Render's reply, so it can be shown.
        response=$(curl -sS --fail-with-body -X POST -H "$auth" -H 'Content-Type: application/json' -d "$body" "$api") \
          || { echo "::error::Render rejected the deploy request: ${response//$'\n'/ }"; exit 1; }
        deploy_id=$(jq -r .id <<<"$response")
        echo "Render deploy $deploy_id"
        for _ in $(seq 1 90); do
          poll=$(curl -sS --fail-with-body -H "$auth" "$api/$deploy_id") \
            || { echo "::error::Render deploy status check failed: ${poll//$'\n'/ }"; exit 1; }
          status=$(jq -r .status <<<"$poll")
          case "$status" in
            live) exit 0 ;;
            build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
              echo "::error::Render deploy $deploy_id ended as $status"; exit 1 ;;
          esac
          sleep 10
        done
        echo "::error::Render deploy $deploy_id not live after 15 minutes"; exit 1

    - name: Check backend health
      shell: bash
      env:
        BACKEND_URL: ${{ inputs.backend-url }}
      run: |
        for _ in $(seq 1 18); do
          if curl -fsS --max-time 20 "$BACKEND_URL/api/health" | jq -e '.status == "UP"'; then exit 0; fi
          sleep 10
        done
        echo "::error::$BACKEND_URL/api/health is not UP"; exit 1

    - name: Deploy frontend
      shell: bash
      env:
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
        VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}
        VERCEL_CLI: ${{ inputs.vercel-cli }}
      run: |
        mkdir -p .vercel tickgeek_frontend
        mv release/frontend .vercel/output
        npx --yes "$VERCEL_CLI" deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"

    - name: Check frontend
      shell: bash
      env:
        FRONTEND_URL: ${{ inputs.frontend-url }}
      run: |
        for _ in $(seq 1 12); do
          if curl -fsS --max-time 20 -o /dev/null "$FRONTEND_URL/sign-in"; then exit 0; fi
          sleep 10
        done
        echo "::error::$FRONTEND_URL/sign-in does not answer"; exit 1
