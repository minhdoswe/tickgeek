services:
  - type: web
    name: tickgeek-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./tickgeek_backend/Dockerfile
    dockerContext: ./tickgeek_backend
    buildFilter:
      paths:
        - tickgeek_backend/**
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: TICKGEEK_AUTH_CODE_SECRET
        generateValue: true
      - key: FRONTEND_SECRET
        generateValue: true
      - key: TICKGEEK_TRUSTED_PROXIES
        value: '10\.\d{1,3}\.\d{1,3}\.\d{1,3}'
