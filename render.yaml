services:
  - type: web
    name: tickgeek-backend
    runtime: image
    image:
      url: ghcr.io/minhdoswe/tickgeek-backend:latest
      creds:
        fromRegistryCreds:
          name: tickgeek
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: TICKGEEK_AUTH_CODE_SECRET
        generateValue: true
      - key: FRONTEND_SECRET
        generateValue: true
      - key: TICKGEEK_TRUSTED_PROXIES
        value: '10\.\d{1,3}\.\d{1,3}\.\d{1,3}'
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
